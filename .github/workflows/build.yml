name: Build and Publish Images

on:
  push:
    branches:
      - "main"
      - "feature/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_API: ghcr.io/craftama/zitadel
  IMAGE_LOGIN: ghcr.io/craftama/zitadel-login

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API binaries (linux only)
        env:
          ZITADEL_VERSION: 0.0.0-dev
        run: |
          pnpm nx run @zitadel/api:pack-linux-amd64
          pnpm nx run @zitadel/api:pack-linux-arm64

      - name: Build Login app
        run: pnpm nx run @zitadel/login:pack-archive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (API)
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=sha,prefix=,suffix=,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: final
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.api-meta.outputs.labels }}
          tags: ${{ steps.api-meta.outputs.tags }}

      - name: Docker meta (Login)
        id: login-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_LOGIN }}
          tags: |
            type=sha,prefix=,suffix=,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Login image
        uses: docker/build-push-action@v6
        with:
          context: apps/login
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.login-meta.outputs.labels }}
          tags: ${{ steps.login-meta.outputs.tags }}
